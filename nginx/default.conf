server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;   # playlist.m3u, guide.xml (from ./output)

  types {
    application/vnd.apple.mpegurl m3u8;
    audio/x-mpegurl m3u;
    video/mp2t ts;
    application/xml xml;
  }

  add_header Access-Control-Allow-Origin "*" always;

  # Live HLS lives on the renderer's in-memory volume.
  location ~ \.m3u8$ {
    root /hls;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location ~ \.ts$ {
    root /hls;
    add_header Cache-Control "public, max-age=60" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
}
