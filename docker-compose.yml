x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  renderer:
    build: ./renderer
    init: true                 # reaps Chromium's orphaned child processes
    shm_size: "512m"           # Chromium shared memory (Docker's default 64MB is too small)
    environment:
      TARGET_URL: "https://v2.weatherscan.net/?90210"
      VIEWPORT_W: "1280"
      VIEWPORT_H: "720"
      CAPTURE_FPS: "30"
      VIDEO_BITRATE: "3500k"   # cap; static scenes use much less
      VIDEO_ENCODER: "auto"    # auto | h264_nvenc | h264_qsv | h264_vaapi | libx264
      CROP_Y: "0"
      TZ: "America/Chicago"

      # Audio: music (files in ./music) | page (the site's own music + narrations) | none
      AUDIO_SOURCE: "page"
      MUSIC_DIR: "/music"
      AUDIO_BITRATE: "128k"
      AUDIO_GAIN_DB: "0"

      # Self-healing
      REFRESH_HOURS: "6"       # seamless background-tab page refresh
      RELAUNCH_HOURS: "24"     # full Chromium restart (a few seconds of black)
      MAX_BROWSER_MB: "2500"   # relaunch Chromium early if it grows past this
      MAX_HEAP_MB: "600"       # refresh the page early if its JS heap grows past this

      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
    # NVIDIA GPU for NVENC encoding. Remove this block on hosts without an NVIDIA GPU;
    # VIDEO_ENCODER=auto then falls back to QSV/VAAPI (if /dev/dri is mapped) or libx264.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    tmpfs:
      - /tmp:size=1g
    volumes:
      - hls:/hls
      - renderer_profile:/profile:ro
      - ./music:/music:ro
    ports:
      - "8081:3001"            # /health
    logging: *logging
    restart: unless-stopped

  xmltv:
    build: ./xmltv
    environment:
      TZ: "America/Chicago"
      CHANNEL_ID: "local.weather"
      CHANNEL_NAME: "Local Weather"
      GUIDE_DAYS: "2"
      OUTPUT_DIR: "/output"
      STREAM_URL: "weather.m3u8"
      M3U_NAME: "playlist.m3u"
      XMLTV_NAME: "guide.xml"
    volumes:
      - ./output:/output
    logging: *logging
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      - renderer
      - xmltv
    ports:
      - "9798:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - hls:/hls:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *logging
    restart: unless-stopped

volumes:
  # HLS segments live in RAM: no disk churn, nothing stale survives a restart.
  hls:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m"
  renderer_profile:
